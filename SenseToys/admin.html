<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<title>Sensotoys · Back-office</title>
</head>
<body>
<main class="wrap" id="contenido"><p class="cargando">Cargando…</p></main>
<script type="module">
import { pintarMarco, exigirSesion, euros, esc, fecha, estadoBadge, ESTADOS, aviso } from './js/ui.js';
import { todosLosPedidos, eventos, incidencias, cambiarEstado } from './js/datos.js';

const usuario = await pintarMarco();
const caja = document.getElementById('contenido');
let pedidos = [], listaEventos = [], listaIncidencias = [], seleccionado = null;

if (exigirSesion(usuario)) {
  if (usuario.rol !== 'admin') {
    caja.innerHTML = '<h1>Acceso restringido</h1><p class="muted">Solo la cuenta de administrador puede ver el back-office.</p>';
  } else {
    cargar();
  }
}

async function cargar() {
  try {
    [pedidos, listaEventos, listaIncidencias] = await Promise.all([todosLosPedidos(), eventos(), incidencias()]);
    if (!seleccionado && pedidos.length) seleccionado = pedidos[0].id;
    pintar();
  } catch (e) {
    caja.innerHTML = `<p class="error-caja">${esc(e.message)}</p>`;
  }
}

function pintar() {
  const cobrado = pedidos.flatMap((p) => p.pagos).filter((x) => x.resultado === 'aceptado')
                         .reduce((a, x) => a + Number(x.importe), 0);
  const rechazados = pedidos.flatMap((p) => p.pagos).filter((x) => x.resultado === 'rechazado').length;
  const d = pedidos.find((p) => p.id === seleccionado);

  caja.innerHTML = `
    <div class="row" style="flex-wrap:wrap;align-items:flex-end;margin-bottom:22px">
      <div><h1>Back-office</h1><div class="muted">Consulta interna de pedidos, eventos e incidencias</div></div>
      <div class="opciones"><button class="btn btn-ghost" id="exp-eventos">Exportar eventos (JSON)</button>
        <button class="btn btn-ghost" id="exp-pedidos">Exportar pedidos (CSV)</button>
        <button class="btn btn-ghost" id="recargar">Recargar</button></div>
    </div>
    <div class="kpis">
      <div class="card pad kpi"><span class="small muted">Pedidos</span><b>${pedidos.length}</b></div>
      <div class="card pad kpi"><span class="small muted">Cobrado (simulado)</span><b>${euros(cobrado)}</b></div>
      <div class="card pad kpi"><span class="small muted">Pagos rechazados</span><b>${rechazados}</b></div>
      <div class="card pad kpi"><span class="small muted">Incidencias abiertas</span><b>${listaIncidencias.filter((i) => i.estado === 'abierta').length}</b></div>
    </div>

    <div class="split">
      <div class="card scroll"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead><tbody>
        ${pedidos.map((p) => `<tr class="clic ${p.id === seleccionado ? 'sel' : ''}" data-id="${p.id}" tabindex="0">
          <td><strong>${p.codigo}</strong></td><td>${esc(p.perfiles?.email)}</td><td>${fecha(p.creado_en)}</td>
          <td>${euros(p.total)}</td><td>${estadoBadge(p.estado)}</td></tr>`).join('')}
      </tbody></table></div>
      ${d ? `<div class="card pad">
        <div class="row"><h2>Detalle</h2><span class="small muted">${d.codigo}</span></div>
        <div class="sum">
          <div><span>Cliente</span><span>${esc(d.perfiles?.nombre)}</span></div>
          <div><span>Pago</span><span>${d.pagos.map((x) => `${x.metodo}${x.ultimos4 ? ' ···· ' + x.ultimos4 : ''} · ${x.resultado}`).join(', ') || '—'}</span></div>
          ${d.lineas_pedido.map((l) => `<div class="small"><span>${esc(l.nombre_producto)} (${esc(l.descripcion_variante)}) × ${l.cantidad}</span><span>${euros(l.importe)}</span></div>`).join('')}
          <div class="small"><span>Envío</span><span>${euros(d.gastos_envio)}</span></div>
          <div class="total"><span>Total</span><span>${euros(d.total)}</span></div>
        </div>
        <label style="margin-top:14px">Cambiar estado</label>
        <div class="opciones">${Object.entries(ESTADOS).map(([k, [t]]) =>
          `<button class="pill ${k === d.estado ? 'on' : ''}" style="font-size:13px;padding:7px 12px" data-estado="${k}">${t}</button>`).join('')}</div>
      </div>` : ''}
    </div>

    <h2 style="margin-top:36px">Últimos eventos registrados</h2>
    <div class="card scroll"><table><thead><tr><th>#</th><th>Evento</th><th>Usuario</th><th>Pedido</th><th>Fecha</th><th>Datos</th></tr></thead><tbody>
      ${listaEventos.slice(0, 40).map((e) => `<tr><td>${e.id}</td><td><strong>${e.tipo}</strong></td>
        <td>${esc(e.perfiles?.email || 'anónimo (' + (e.sesion_id || '—') + ')')}</td><td>${e.pedidos?.codigo || '—'}</td>
        <td>${fecha(e.creado_en)}</td><td class="mono">${esc(JSON.stringify(e.datos))}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">Sin eventos todavía.</td></tr>'}
    </tbody></table></div>

    <h2 style="margin-top:36px">Incidencias y postventa</h2>
    <div class="card scroll"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Pedido</th><th>Motivo</th><th>Mensaje</th><th>Estado</th></tr></thead><tbody>
      ${listaIncidencias.map((i) => `<tr><td>${fecha(i.creado_en)}</td><td>${esc(i.perfiles?.email)}</td><td>${i.pedidos?.codigo || '—'}</td>
        <td>${esc(i.motivo)}</td><td>${esc(i.mensaje)}</td><td>${esc(i.estado)}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">Sin incidencias.</td></tr>'}
    </tbody></table></div>`;
}

// Descarga un fichero generado en el navegador (funciona en GitHub Pages)
function descargar(nombre, contenido, tipo) {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = Object.assign(document.createElement('a'), { href: url, download: nombre });
  a.click(); URL.revokeObjectURL(url);
}

caja.addEventListener('click', async (e) => {
  const fila = e.target.closest('tr[data-id]');
  if (fila) { seleccionado = Number(fila.dataset.id); pintar(); return; }
  const b = e.target.closest('button'); if (!b) return;

  if (b.dataset.estado) {
    try { await cambiarEstado(seleccionado, b.dataset.estado); aviso('Estado actualizado'); await cargar(); }
    catch (err) { aviso(err.message); }
  } else if (b.id === 'recargar') {
    cargar();
  } else if (b.id === 'exp-eventos') {
    descargar('eventos-sensotoys.json', JSON.stringify(listaEventos, null, 2), 'application/json');
  } else if (b.id === 'exp-pedidos') {
    const cab = ['codigo', 'cliente', 'fecha', 'estado', 'subtotal', 'descuento', 'envio', 'total', 'pago', 'resultado'];
    const filas = pedidos.map((p) => [p.codigo, p.perfiles?.email, p.creado_en, p.estado, p.subtotal, p.descuento,
      p.gastos_envio, p.total, p.pagos[0]?.metodo || '', p.pagos[0]?.resultado || '']);
    const csv = [cab, ...filas].map((f) => f.map((x) => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
    descargar('pedidos-sensotoys.csv', '\ufeff' + csv, 'text/csv');   // \ufeff: Excel abre bien las tildes
  }
});
caja.addEventListener('keydown', (e) => {
  const fila = e.target.closest('tr[data-id]');
  if (fila && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); seleccionado = Number(fila.dataset.id); pintar(); }
});
</script>
</body>
</html>
