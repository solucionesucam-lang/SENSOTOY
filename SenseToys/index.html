<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<title>Sensotoys · Inicio</title>
</head>
<body>
<main class="wrap">
  <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;align-items:center">
    <div>
      <div class="small" style="color:var(--green);font-weight:700" id="kicker">&nbsp;</div>
      <h1 style="font-size:clamp(38px,5vw,56px)">Juguetes sensoriales que se coleccionan</h1>
      <p class="lead">Squishies y fidgets fabricados por tiradas cortas. Cada pieza indica su textura, su tamaño y cuántas unidades quedan de su edición.</p>
      <a class="btn btn-primary" href="catalogo.html">Ver catálogo</a>
      <a class="btn btn-ghost" href="catalogo.html?categoria=limitadas">Ediciones limitadas</a>
    </div>
    <div class="photo" style="height:340px;background:#F2B8C6">[Foto de producto pendiente]</div>
  </section>
  <h2 style="margin-top:48px">Categorías</h2>
  <div class="grid" id="categorias"><p class="cargando">Cargando…</p></div>
  <h2 style="margin-top:48px">Destacados</h2>
  <div class="grid" id="destacados"><p class="cargando">Cargando…</p></div>
</main>
<script type="module">
import { pintarMarco, tarjetaProducto, esc } from './js/ui.js';
import { categorias, productos } from './js/datos.js';

await pintarMarco();
try {
  const [cats, prods] = await Promise.all([categorias(), productos()]);
  document.getElementById('categorias').innerHTML = cats.map((c) => `
    <a class="card" href="catalogo.html?categoria=${c.slug}">
      <div class="pname" style="font-size:20px">${esc(c.nombre)}</div>
      <div class="small muted">${esc(c.descripcion)}</div></a>`).join('');
  document.getElementById('destacados').innerHTML = prods.slice(0, 4).map(tarjetaProducto).join('');
  const aurora = prods.find((p) => p.es_edicion_limitada);
  if (aurora) {
    const quedan = aurora.variantes.reduce((a, v) => a + v.stock, 0);
    document.getElementById('kicker').textContent = `${aurora.nombre}: quedan ${quedan} de ${aurora.unidades_edicion}`;
  }
} catch (e) {
  document.getElementById('categorias').innerHTML = `<p class="error-caja">No se pudo conectar con la base de datos: ${esc(e.message)}</p>`;
  document.getElementById('destacados').innerHTML = '';
}
</script>
</body>
</html>
