<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<title>Sensotoys · Entrar</title>
</head>
<body>
<main class="wrap" style="max-width:520px">
  <h1>Entrar</h1>
  <p class="muted">Usa una de las cuentas de prueba del README. No uses tu correo ni tus contraseñas reales.</p>
  <form id="form" class="card pad" style="display:flex;flex-direction:column;gap:12px" novalidate>
    <div><label for="email">Correo de prueba</label>
      <input id="email" type="email" autocomplete="username" placeholder="cliente1@sensotoys-demo.test"></div>
    <div><label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password"></div>
    <div id="error" class="error-caja" style="display:none"></div>
    <button class="btn btn-primary" id="entrar">Entrar</button>
  </form>
  <p class="small muted" style="margin-top:14px">Cuentas: admin@ y cliente1@ … cliente4@sensotoys-demo.test</p>
</main>
<script type="module">
import { pintarMarco, param } from './js/ui.js';
import { iniciarSesion } from './js/datos.js';

await pintarMarco();
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const error = document.getElementById('error');
  const boton = document.getElementById('entrar');
  error.style.display = 'none';
  if (!email.endsWith('@sensotoys-demo.test') || !password) {
    error.textContent = 'Introduce una cuenta de prueba @sensotoys-demo.test y su contraseña.';
    error.style.display = 'block';
    return;
  }
  boton.disabled = true;
  try {
    await iniciarSesion(email, password);
    // Solo se vuelve a páginas de esta misma web
    const volver = param('volver');
    location.href = volver && /^[a-z]+\.html/.test(volver) ? volver : 'index.html';
  } catch {
    error.textContent = 'Correo o contraseña incorrectos.';
    error.style.display = 'block';
    boton.disabled = false;
  }
});
</script>
</body>
</html>
