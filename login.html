<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/estilos.css">
<title>Sensotoys · Entrar</title>
</head>
<body>
<main class="pagina-login">
  <div class="log-form-lado">
    <div class="log-form-in">
      <p class="seccion-num">Tu cuenta</p>
      <h1 class="log-titulo">Vuelve a <em>entrar</em></h1>
      <p class="entradilla">Usa una de las cuentas de prueba del README. No uses tu correo ni tus contraseñas reales.</p>
      <form id="form" class="card pad pila-s log-form" novalidate>
        <div><label for="email">Correo de prueba</label>
          <input id="email" type="email" autocomplete="username" placeholder="cliente1@sensotoys-demo.test"></div>
        <div><label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password"></div>
        <div id="error" class="error-caja" role="alert" hidden></div>
        <button class="btn btn-primary btn-grande" id="entrar">Entrar</button>
      </form>
      <p class="small muted mt-m">Cuentas: admin@ y cliente1@ … cliente4@sensotoys-demo.test</p>
    </div>
  </div>
  <div class="log-arte" aria-hidden="true">
    <svg class="forma forma-1 forma-rosa log-b1" viewBox="0 0 200 200" focusable="false"><path fill="currentColor" d="M174.5 123.1C167.1 147.6 141.4 183.2 120 187.8C98.5 192.3 63.7 169.4 45.7 150.3C27.7 131.1 5.9 93.5 12.1 72.8C18.3 52.1 57.7 31.3 83.1 25.9C108.6 20.5 149.3 24 164.6 40.2C179.8 56.4 181.9 98.5 174.5 123.1Z"/></svg>
    <svg class="forma forma-5 forma-lavanda log-b2" viewBox="0 0 200 200" focusable="false"><path fill="currentColor" d="M192.1 118.7C188.6 136.2 160.5 151.1 142 163.3C123.5 175.6 98.9 195.7 81.3 192.1C63.8 188.6 48.9 160.5 36.7 142C24.4 123.5 4.3 98.9 7.9 81.3C11.4 63.8 39.5 48.9 58 36.7C76.5 24.4 101.1 4.3 118.7 7.9C136.2 11.4 151.1 39.5 163.3 58C175.6 76.5 195.7 101.1 192.1 118.7Z"/></svg>
    <svg class="forma forma-4 forma-mantequilla log-b3" viewBox="0 0 200 200" focusable="false"><path fill="currentColor" d="M161.3 163.1C143.1 180.8 64.9 175.9 44 154.3C23.1 132.8 17.7 51.7 35.9 34C54.1 16.4 132.2 26.9 153.1 48.4C174 70 179.5 145.5 161.3 163.1Z"/></svg>
    <div class="log-foto log-foto-a recorte-blob"><img src="img/productos/nube-mochi-aurora-lavanda-4x5.webp" alt="" width="800" height="1000" loading="lazy" decoding="async"></div>
    <div class="log-foto log-foto-b recorte-arco"><img src="img/productos/pop-it-hexagono-rosa-4x5.webp" alt="" width="800" height="1000" loading="lazy" decoding="async"></div>
    <div class="log-foto log-foto-c recorte-circulo"><img src="img/productos/cubo-infinito-mate-verde-4x5.webp" alt="" width="800" height="1000" loading="lazy" decoding="async"></div>
    <p class="log-lema">Aprieta, respira, <em>repite</em>.</p>
  </div>
</main>
<script type="module">
import { pintarMarco, param } from './js/ui.js';
import { iniciarSesion } from './js/datos.js';

await pintarMarco();
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const error = document.getElementById('error');
  const boton = document.getElementById('entrar');
  error.hidden = true;
  if (!email.endsWith('@sensotoys-demo.test') || !password) {
    error.textContent = 'Introduce una cuenta de prueba @sensotoys-demo.test y su contraseña.';
    error.hidden = false;
    return;
  }
  boton.disabled = true;
  try {
    await iniciarSesion(email, password);
    // Solo se vuelve a páginas de esta misma web
    const volver = param('volver');
    location.href = volver && /^[a-z]+\.html/.test(volver) ? volver : 'index.html';
  } catch {
    error.textContent = 'Correo o contraseña incorrectos.';
    error.hidden = false;
    boton.disabled = false;
  }
});
</script>
</body>
</html>
