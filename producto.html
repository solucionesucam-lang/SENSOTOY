<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/estilos.css">
<title>Sensotoys · Producto</title>
</head>
<body>
<main class="wrap">
  <div id="pasillo"></div>
  <div id="ficha"><p class="cargando">Cargando…</p></div>
</main>
<script type="module">
import { pintarMarco, euros, esc, param, aviso, leerCarrito, guardarCarrito, CONFIG, configLista, imgProducto,
         montarPasillo, recordarProducto, animarCarrito } from './js/ui.js';
import { productoPorSlug, registrarEvento } from './js/datos.js';

await pintarMarco();
montarPasillo(document.getElementById('pasillo'), 'producto');
const caja = document.getElementById('ficha');
let producto, color, talla;

try {
  if (!configLista()) throw new Error('No se pudo cargar la configuración de la tienda.');
  producto = await productoPorSlug(param('slug'));
} catch (e) {
  caja.innerHTML = `<p class="error-caja">${esc(e.message)}</p>`;
}
if (producto === null) caja.innerHTML = '<h1>Producto no encontrado</h1><a href="catalogo.html">Volver al catálogo</a>';

if (producto) {
  document.title = 'Sensotoys · ' + producto.nombre;
  recordarProducto(producto.slug);
  // Variante inicial: la primera con stock
  const inicial = producto.variantes.find((v) => v.stock > 0) || producto.variantes[0];
  color = inicial.color; talla = inicial.talla;
  registrarEvento('product.viewed', { producto_id: producto.id, producto: producto.slug, sku: inicial.sku });
  pintar();
}

function varianteElegida() {
  return producto.variantes.find((v) => v.color === color && v.talla === talla);
}

function pintar() {
  const v = varianteElegida();
  const colores = [...new Map(producto.variantes.map((x) => [x.color, x.color_hex]))];
  const tallas = producto.variantes.filter((x) => x.color === color);
  const carritoActual = leerCarrito();
  const enCarrito = carritoActual.find((l) => l.variante_id === v.id)?.cantidad || 0;
  const enProducto = carritoActual.filter((l) => producto.variantes.some((x) => x.id === l.variante_id))
    .reduce((a, l) => a + l.cantidad, 0);
  const max = Math.max(0, Math.min(CONFIG.maxPorProducto - enProducto, v.stock - enCarrito));
  const stockTotal = producto.variantes.reduce((a, x) => a + x.stock, 0);

  caja.innerHTML = `
    <div class="small muted migas"><a href="catalogo.html">Catálogo</a> /
      <a href="catalogo.html?categoria=${encodeURIComponent(producto.categorias.slug)}">${esc(producto.categorias.nombre)}</a> / ${esc(producto.nombre)}</div>
    <div class="split">
      <div class="photo photo-ficha" data-bg="${esc(v.color_hex)}">${imgProducto(producto.slug, color, producto.nombre)}</div>

      <div>
        ${producto.es_edicion_limitada ? `<span class="badge">Edición limitada · quedan ${stockTotal} de ${producto.unidades_edicion}</span>` : ''}
        <h1 class="titulo-aparte">${esc(producto.nombre)}</h1>
        <p class="muted">${esc(producto.descripcion)}</p>

        <label>Color: <span class="dato">${esc(color)}</span></label>
        <div class="opciones">${colores.map(([nombre, hex]) =>
          `<button class="dot ${nombre === color ? 'on' : ''}" data-bg="${esc(hex)}" data-color="${esc(nombre)}"
             aria-label="Color ${esc(nombre)}" aria-pressed="${nombre === color}"></button>`).join('')}</div>

        <label>Tamaño</label>
        <div class="opciones">${tallas.map((x) =>
          `<button class="chip ${x.talla === talla ? 'on' : ''}" data-talla="${esc(x.talla)}" aria-pressed="${x.talla === talla}">
             ${esc(x.talla)}${x.medida_cm ? ' · ' + x.medida_cm + ' cm' : ''}</button>`).join('')}</div>

        <div class="card pad pila-s">
          <div><span class="price">${euros(v.precio)}</span> <span class="small muted">IVA del 21 % incluido</span></div>
          <div class="small">${v.stock > 0 ? `${v.stock} unidades de esta variante · Ref. ${esc(v.sku)}` : 'Agotada'}</div>
          <div class="fila-cantidad">
            <label for="cantidad">Cantidad</label>
            <input id="cantidad" class="corto" type="number" min="1" max="${max}" value="1" ${max === 0 ? 'disabled' : ''}>
            <span class="small muted">Máximo ${CONFIG.maxPorProducto} por producto${enProducto ? ` (ya tienes ${enProducto})` : ''}</span>
          </div>
          <div class="err" id="error" role="alert"></div>
          <button class="btn btn-primary" id="anadir" ${max === 0 ? 'disabled' : ''}>${v.stock === 0 ? 'Agotado' : 'Añadir al carrito'}</button>
          <div class="small muted">Envío ${euros(CONFIG.gastosEnvio)} · Gratis a partir de ${euros(CONFIG.envioGratis)}</div>
        </div>

        <h2 class="subtitulo">Ficha técnica</h2>
        <p class="small muted">Textura: ${esc(v.textura)} · Material: ${esc(producto.material)} · Edad recomendada: desde ${producto.edad_minima} años</p>
      </div>
    </div>`;
}

caja.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.color) {
    color = b.dataset.color;
    // Si la talla elegida no existe en este color, se coge la primera disponible
    if (!varianteElegida()) talla = producto.variantes.find((v) => v.color === color).talla;
    pintar();
  } else if (b.dataset.talla) {
    talla = b.dataset.talla; pintar();
  } else if (b.id === 'anadir') {
    const input = document.getElementById('cantidad');
    const cantidad = parseInt(input.value, 10);
    if (!Number.isInteger(cantidad) || cantidad < 1 || cantidad > Number(input.max)) {
      document.getElementById('error').textContent = `Elige una cantidad entre 1 y ${input.max}.`;
      input.classList.add('mal');
      return;
    }
    const v = varianteElegida();
    const carrito = leerCarrito();
    const linea = carrito.find((l) => l.variante_id === v.id);
    if (linea) linea.cantidad += cantidad; else carrito.push({ variante_id: v.id, cantidad });
    guardarCarrito(carrito);
    registrarEvento('cart.item_added', { variante_id: v.id, sku: v.sku, cantidad, precio: v.precio });
    aviso('Añadido al carrito');
    animarCarrito();
    pintar();
    document.getElementById('anadir').classList.add('anim-ok');
  }
});
</script>
</body>
</html>
