<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<title>Sensotoys · Finalizar pedido</title>
</head>
<body>
<main class="wrap">
  <h1>Finalizar pedido</h1>
  <div id="contenido"><p class="cargando">Cargando…</p></div>
</main>
<script type="module">
import { pintarMarco, exigirSesion, euros, esc, leerCarrito, guardarCarrito, resumenImportes } from './js/ui.js';
import { variantesPorId, crearPedido, registrarEvento } from './js/datos.js';

const usuario = await pintarMarco();
const caja = document.getElementById('contenido');

if (exigirSesion(usuario)) {
  const carrito = leerCarrito();
  if (carrito.length === 0) location.href = 'carrito.html';
  else iniciar(carrito).catch((e) => { caja.innerHTML = `<p class="error-caja">${esc(e.message)}</p>`; });
}

async function iniciar(carrito) {
  const variantes = await variantesPorId(carrito.map((l) => l.variante_id));
  const subtotal = carrito.reduce((a, l) => a + variantes.find((v) => v.id === l.variante_id).precio * l.cantidad, 0);
  const r = resumenImportes(subtotal);
  registrarEvento('checkout.started', { lineas: carrito.length, subtotal });

  caja.innerHTML = `
  <form id="form" class="split" novalidate>
    <div style="display:flex;flex-direction:column;gap:22px">
      <div class="card pad"><h2>Datos de envío</h2>
        <div class="form2">
          ${campo('nombre', 'Nombre y apellidos', usuario.nombre)}
          ${campo('direccion', 'Dirección', '')}
          ${campo('cp', 'Código postal', '', 'inputmode="numeric" maxlength="5"')}
          ${campo('ciudad', 'Ciudad', '')}
          ${campo('provincia', 'Provincia', '')}
        </div>
        <p class="small muted">Usa una dirección inventada: es un prototipo sin datos reales.</p>
      </div>
      <div class="card pad"><div class="row"><h2>Pago simulado</h2><span class="badge">Entorno de pruebas</span></div>
        <div class="opciones">
          <label class="chip on" style="margin:0"><input type="radio" name="metodo" value="tarjeta" checked style="width:auto"> Tarjeta de prueba</label>
          <label class="chip" style="margin:0"><input type="radio" name="metodo" value="contrareembolso" style="width:auto"> Contra reembolso</label>
        </div>
        <div id="bloque-tarjeta">${campo('tarjeta', 'Número de tarjeta de prueba', '4242 4242 4242 4242', 'inputmode="numeric" autocomplete="off"')}
          <p class="small muted">4242 4242 4242 4242 → pago aceptado. Cualquier número de 16 cifras acabado en 0000 → pago rechazado. Solo se guardan los 4 últimos dígitos.</p></div>
      </div>
    </div>
    <div>
      <div class="card pad">
        <h2>Tu pedido</h2>
        ${carrito.map((l) => { const v = variantes.find((x) => x.id === l.variante_id);
          return `<div class="row small" style="padding:4px 0"><span>${esc(v.productos.nombre)} · ${esc(v.color)} · ${esc(v.talla)} × ${l.cantidad}</span><strong>${euros(v.precio * l.cantidad)}</strong></div>`; }).join('')}
        ${campo('cupon', 'Cupón (opcional)', '', 'placeholder="SENSOTOY10"')}
        <div class="sum" style="margin-top:6px">
          <div><span>Subtotal (IVA incl.)</span><span>${euros(r.subtotal)}</span></div>
          <div><span>Envío</span><span>${r.envio ? euros(r.envio) : 'Gratis'}</span></div>
          <div class="total"><span>Total estimado</span><span>${euros(r.total)}</span></div>
        </div>
        <p class="small muted">El descuento del cupón y el total definitivo los calcula la base de datos al confirmar.</p>
      </div>
      <div id="error-general" class="error-caja" style="display:none;margin-top:14px"></div>
      <button class="btn btn-primary" id="pagar" style="width:100%;margin-top:14px">Confirmar y pagar (simulado)</button>
      <p class="small muted" style="text-align:center">No se realizará ningún cobro real</p>
    </div>
  </form>`;

  const form = document.getElementById('form');
  form.addEventListener('change', (e) => {
    if (e.target.name !== 'metodo') return;
    form.querySelectorAll('label.chip').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
    document.getElementById('bloque-tarjeta').style.display = e.target.value === 'tarjeta' ? '' : 'none';
  });
  form.addEventListener('submit', (e) => { e.preventDefault(); enviar(form, carrito); });
}

function campo(id, texto, valor, extra = '') {
  return `<div><label for="${id}">${texto}</label>
    <input id="${id}" name="${id}" value="${esc(valor)}" ${extra}><div class="err" id="err-${id}"></div></div>`;
}

// Validación en el navegador: solo para avisar rápido al usuario.
// La validación que manda es la de la base de datos.
function validar(d) {
  const errores = {};
  if (d.nombre.length < 3) errores.nombre = 'Escribe nombre y apellidos.';
  if (d.direccion.length < 5) errores.direccion = 'Escribe una dirección.';
  if (!/^[0-9]{5}$/.test(d.cp)) errores.cp = 'Deben ser 5 dígitos.';
  if (!d.ciudad) errores.ciudad = 'Obligatorio.';
  if (!d.provincia) errores.provincia = 'Obligatorio.';
  if (d.metodo === 'tarjeta' && !/^[0-9]{16}$/.test(d.tarjeta.replace(/\s/g, ''))) errores.tarjeta = 'Deben ser 16 dígitos.';
  return errores;
}

async function enviar(form, carrito) {
  const f = form.elements;
  const d = {
    nombre: f.nombre.value.trim(), direccion: f.direccion.value.trim(), cp: f.cp.value.trim(),
    ciudad: f.ciudad.value.trim(), provincia: f.provincia.value.trim(),
    metodo: f.metodo.value, tarjeta: f.tarjeta.value, cupon: f.cupon.value.trim()
  };
  form.querySelectorAll('.err').forEach((x) => (x.textContent = ''));
  form.querySelectorAll('.mal').forEach((x) => x.classList.remove('mal'));
  const errores = validar(d);
  for (const [id, msg] of Object.entries(errores)) {
    document.getElementById('err-' + id).textContent = msg;
    f[id].classList.add('mal');
  }
  if (Object.keys(errores).length) { form.querySelector('.mal').focus(); return; }

  const boton = document.getElementById('pagar');
  const cajaError = document.getElementById('error-general');
  boton.disabled = true; boton.textContent = 'Procesando…'; cajaError.style.display = 'none';
  try {
    const r = await crearPedido({
      lineas: carrito,
      envio: { nombre: d.nombre, direccion: d.direccion, cp: d.cp, ciudad: d.ciudad, provincia: d.provincia },
      metodo: d.metodo,
      tarjeta: d.metodo === 'tarjeta' ? d.tarjeta : null,
      cupon: d.cupon
    });
    guardarCarrito([]);
    location.href = 'pedido.html?codigo=' + encodeURIComponent(r.codigo);
  } catch (err) {
    cajaError.textContent = err.message;   // mensaje que devuelve la base de datos
    cajaError.style.display = 'block';
    boton.disabled = false; boton.textContent = 'Confirmar y pagar (simulado)';
  }
}
</script>
</body>
</html>
