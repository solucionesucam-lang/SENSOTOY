<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/estilos.css">
<title>Sensotoys · Ayuda y postventa</title>
</head>
<body>
<main class="wrap wrap-estrecho">
  <h1>Ayuda y postventa</h1>
  <p class="muted">Cuéntanos qué ha pasado. La solicitud se guarda en la base de datos.</p>
  <div id="contenido"><p class="cargando">Cargando…</p></div>
</main>
<script type="module">
import { pintarMarco, exigirSesion, param, aviso, esc } from './js/ui.js';
import { misPedidos, crearIncidencia } from './js/datos.js';

const usuario = await pintarMarco();
const caja = document.getElementById('contenido');
const MOTIVOS = { pago_rechazado: 'Problema con el pago', retraso_envio: 'Retraso en el envío',
                  producto_defectuoso: 'Producto defectuoso', otro: 'Otro motivo' };

if (exigirSesion(usuario)) {
  const pedidos = await misPedidos().catch(() => []);
  const elegido = param('pedido');
  caja.innerHTML = `
    <form id="form" class="card pad pila-s" novalidate>
      <div><label for="pedido">Pedido</label><select id="pedido">
        <option value="">Consulta general (sin pedido)</option>
        ${pedidos.map((p) => `<option value="${p.id}" ${String(p.id) === elegido ? 'selected' : ''}>${esc(p.codigo)}</option>`).join('')}
      </select></div>
      <div><label for="motivo">Motivo</label><select id="motivo">
        <option value="">Elige un motivo</option>
        ${Object.entries(MOTIVOS).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}
      </select><div class="err" id="err-motivo"></div>
        <p class="small muted">Solo «Producto defectuoso» y «Retraso en el envío» pasan el pedido a estado «Con incidencia». Con los demás motivos la solicitud se registra y el pedido no cambia.</p></div>
      <div><label for="mensaje">Descripción</label><textarea id="mensaje" rows="5" maxlength="1000"></textarea>
        <div class="err" id="err-mensaje"></div></div>
      <div id="error-general" class="error-caja" role="alert" hidden></div>
      <button class="btn btn-primary" id="enviar">Enviar solicitud</button>
    </form>`;

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const motivo = document.getElementById('motivo').value;
    const mensaje = document.getElementById('mensaje').value.trim();
    document.getElementById('err-motivo').textContent = motivo ? '' : 'Elige un motivo.';
    document.getElementById('err-mensaje').textContent = mensaje.length >= 10 ? '' : 'Mínimo 10 caracteres.';
    if (!motivo || mensaje.length < 10) return;
    const boton = document.getElementById('enviar');
    boton.disabled = true;
    try {
      await crearIncidencia({ motivo, mensaje, pedidoId: document.getElementById('pedido').value || null });
      caja.innerHTML = '<div class="card pad"><h2>Solicitud registrada</h2><p class="muted">Te responderemos lo antes posible.</p><a class="btn btn-primary" href="index.html">Volver al inicio</a></div>';
      aviso('Incidencia guardada');
    } catch (err) {
      const box = document.getElementById('error-general');
      box.textContent = err.message; box.hidden = false;
      boton.disabled = false;
    }
  });
}
</script>
</body>
</html>
